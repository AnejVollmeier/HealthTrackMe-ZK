name: Backend CI Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: healthtrackme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Test, build, and generate coverage
        run: ./mvnw -B clean verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: apps/api/target/surefire-reports/
          if-no-files-found: warn

      - name: Verify coverage reports
        run: |
          test -s target/site/jacoco/index.html
          test -s target/site/jacoco/jacoco.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: apps/api/target/site/jacoco/
          if-no-files-found: error

      - name: Build Docker image
        run: |
          max_attempts=3
          base_delay=5
          for attempt in $(seq 1 "${max_attempts}"); do
            if docker build -t healthtrackme-api .; then
              exit 0
            fi
            if [ "${attempt}" -lt "${max_attempts}" ]; then
              delay=$((base_delay * attempt))
              echo "Docker build failed on attempt ${attempt}. Retrying in ${delay}s..."
              sleep "${delay}"
            fi
          done
          echo "Docker build failed after ${max_attempts} attempts."
          exit 1
